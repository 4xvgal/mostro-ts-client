# Regtest development stack: bitcoind + two LND nodes (alice/bob) + local
# Nostr relay + Mostro daemon.
#
# Fully self-contained: bitcoind funds the network, `lnd-alice` is Mostro's
# Lightning node, `lnd-bob` pays hold invoices during trades, and the
# `regtest-init` one-shot service waits for readiness then auto-funds both
# nodes and opens the alice<->bob channel.
#
#   docker compose -f docker-compose.regtest.yml up --build
#
# After the stack is up, `regtest-init` exits 0 once the channel is active;
# `docker logs mostro-regtest-init -f` shows progress.
#
# The shared volume `lnd-alice-data` exposes LND's tls.cert and admin.macaroon
# to Mostro as read-only mounts at `/config/lnd`. UIDs are pinned to 1000 so
# LND-generated files are readable by Mostro's non-root user.

name: mostro-regtest

services:
  bitcoind:
    image: polarlightning/bitcoind:30.0
    container_name: mostro-regtest-bitcoind
    command:
      - bitcoind
      - --regtest
      - --server=1
      - --daemon=0
      - --txindex=1
      - --fallbackfee=0.00001
      - --rpcuser=bitcoinrpc
      - --rpcpassword=regtestpass
      - --rpcbind=0.0.0.0
      - --rpcallowip=0.0.0.0/0
      - --zmqpubrawblock=tcp://0.0.0.0:28332
      - --zmqpubrawtx=tcp://0.0.0.0:28333
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    ports:
      - "18443:18443"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=bitcoinrpc", "-rpcpassword=regtestpass", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default

  lnd-alice:
    image: polarlightning/lnd:0.20.0-beta
    container_name: mostro-regtest-lnd-alice
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - lnd
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=bitcoinrpc
      - --bitcoind.rpcpass=regtestpass
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --noseedbackup
      - --accept-keysend
      - --tlsautorefresh
      - --tlsextradomain=lnd-alice
    environment:
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      - lnd-alice-data:/home/lnd/.lnd
    ports:
      - "10009:10009"
      - "9735:9735"
    networks:
      - default

  lnd-bob:
    image: polarlightning/lnd:0.20.0-beta
    container_name: mostro-regtest-lnd-bob
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - lnd
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=bitcoinrpc
      - --bitcoind.rpcpass=regtestpass
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --rpclisten=0.0.0.0:11009
      - --restlisten=0.0.0.0:8081
      - --listen=0.0.0.0:9736
      - --noseedbackup
      - --accept-keysend
      - --tlsautorefresh
      - --tlsextradomain=lnd-bob
    environment:
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      - lnd-bob-data:/home/lnd/.lnd
    ports:
      - "11009:11009"
      - "9736:9736"
    networks:
      - default

  nostr-relay:
    image: scsibug/nostr-rs-relay
    container_name: mostro-regtest-nostr-relay
    ports:
      - "${MOSTRO_RELAY_LOCAL_PORT:-7000}:8080"
    volumes:
      - relay-data:/usr/src/app/db
    networks:
      - default

  mostro:
    # Official prebuilt image (linux/amd64 + linux/arm64). Use `--build` with
    # a local mostro checkout instead if you need to patch the daemon.
    image: mostrop2p/mostro:latest
    container_name: mostro-regtest-daemon
    depends_on:
      lnd-alice:
        condition: service_started
      nostr-relay:
        condition: service_started
    environment:
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      # settings.toml + mostro.db (see docker/regtest/settings.toml)
      - ./regtest/config:/config
      # LND cert + macaroon, read-only (generated by lnd-alice)
      - lnd-alice-data:/config/lnd:ro
    networks:
      - default

  # One-shot init: waits for bitcoind + LND, funds and opens the channel.
  # Runs after the stack is up; exit 0 = channel ready.
  regtest-init:
    build:
      context: ./regtest
      dockerfile: init.Dockerfile
    container_name: mostro-regtest-init
    depends_on:
      bitcoind:
        condition: service_healthy
      lnd-alice:
        condition: service_started
      lnd-bob:
        condition: service_started
    environment:
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      - lnd-alice-data:/alice/.lnd:ro
      - lnd-bob-data:/bob/.lnd:ro
    networks:
      - default
    restart: "no"

volumes:
  bitcoind-data:
  lnd-alice-data:
  lnd-bob-data:
  relay-data:

networks:
  default:
    driver: bridge