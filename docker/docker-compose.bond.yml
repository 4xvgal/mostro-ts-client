# Bond-mode override for the regtest stack.
#
# Mounts a settings.toml with the anti-abuse bond enabled (apply_to = make)
# over the base config, without touching the default (bond-off) setup used by
# the regular e2e suite.
#
#   docker compose -f docker/docker-compose.regtest.yml -f docker/docker-compose.bond.yml up -d --force-recreate mostro
#   npx tsx test/e2e-bond.ts
#
# Back to normal (bond off):
#   docker compose -f docker/docker-compose.regtest.yml up -d --force-recreate mostro
services:
  mostro:
    volumes:
      - ./regtest/settings.bond.toml:/config/settings.toml:ro
